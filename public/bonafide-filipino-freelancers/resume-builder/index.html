<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job-Match Resume Starter · Bonafide Filipino Freelancers</title>
<link rel="icon" type="image/png" href="../../brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #5a4a7a;
    --purple-deep: #4a3a6a;
    --gold: #c8985f;
    --gold-deep: #a88d5e;
    --bg: #f5f1f0;
    --card: #ffffff;
    --text: #3a3a3a;
    --muted: #6b6565;
    --border: #e0dbd8;
    --sand: #ede7e3;
    --green: #5a8a72;
    --red: #c45a5a;
    --rose: #a0756a;
    --lavender: #7a6a8f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .serif {
    font-family: 'Playfair Display', Georgia, serif;
    color: var(--purple);
    letter-spacing: -0.005em;
  }
  .app { max-width: 1180px; margin: 0 auto; padding: 24px 18px 80px; }

  /* Site navigation */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topnav-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .logo {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    color: var(--purple);
    font-size: 22px;
    line-height: 1.05;
    letter-spacing: 0;
    text-decoration: none;
  }
  .logo .sub {
    font-family: 'Inter', system-ui, sans-serif;
    display: block;
    margin-top: 1px;
    color: var(--gold-deep);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .nav-links {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 22px;
    font-size: 14px;
  }
  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    white-space: nowrap;
    transition: color .15s;
  }
  .nav-links a:hover { color: var(--purple); }
  .nav-links a[aria-current="page"] {
    color: var(--purple);
    font-weight: 600;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 2px;
  }
  @media (max-width: 768px) {
    .topnav-inner {
      align-items: flex-start;
      flex-direction: column;
      gap: 10px;
      padding: 12px 18px;
    }
    .nav-links {
      width: 100%;
      overflow-x: visible;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
      padding-bottom: 4px;
    }
    .nav-links a { white-space: normal; }
    .nav-links::-webkit-scrollbar { display: none; }
  }
  @media (max-width: 560px) {
    body { width: 100%; max-width: 100vw; overflow-x: hidden; }
    .topnav, .app, footer { width: 100%; max-width: 100vw; overflow-x: hidden; }
    .topnav-inner, .nav-links, .starter-shell, .starter-panel { min-width: 0; }
    .app { padding-left: 18px; padding-right: 18px; }
    .topnav-inner { padding-left: 18px; padding-right: 18px; }
  }

  /* Header / progress */
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 18px;
    border-top: 3px solid var(--purple);
  }
  @media (max-width: 640px) {
    header.top {
      align-items: flex-start;
      flex-direction: column;
    }
    .stepbar {
      max-width: none;
      width: 100%;
    }
  }
  header.top .brand {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: var(--purple);
    font-size: 18px;
  }
  header.top .brand small { font-family: 'Inter'; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; display: block; margin-top: 2px; font-weight: 600; }
  .stepbar { display: flex; gap: 4px; flex: 1; max-width: 360px; }
  .stepbar .step {
    flex: 1; height: 6px; background: var(--border); border-radius: 6px;
    transition: background .25s ease;
  }
  .stepbar .step.done { background: var(--green); }
  .stepbar .step.active { background: var(--gold); }
  header.top .save-state { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
  header.top .save-state.saving { color: var(--gold-deep); }
  header.top .save-state.saved { color: var(--green); }
  .reset-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;
    text-transform: uppercase; letter-spacing: .1em; font-weight: 600;
  }
  .reset-btn:hover { color: var(--red); border-color: var(--red); }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 26px;
    box-shadow: 0 1px 3px rgba(74,58,106,0.05);
  }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .18em; color: var(--gold-deep); font-weight: 700; margin-bottom: 8px; }
  h1 { font-size: clamp(24px, 4vw, 32px); margin: 0 0 10px; }
  h2 { font-size: 20px; margin: 22px 0 10px; }
  h3 { font-size: 15px; margin: 16px 0 6px; color: var(--purple-deep); }
  p.lede { color: var(--muted); margin-top: 0; font-size: 15px; }

  /* Form fields */
  label.field {
    display: flex;
    flex-direction: column;
    margin-bottom: 14px;
  }
  /* Push inputs to bottom of label so siblings in row2/row3 align even when one has a hint and the other doesn't */
  label.field > input,
  label.field > textarea,
  label.field > select {
    margin-top: auto;
  }
  label.field > .lbl {
    display: block; font-size: 12px; font-weight: 600; color: var(--text);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: .08em;
  }
  label.field > .hint { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 400; text-transform: none; letter-spacing: 0; }
  input[type=text], input[type=email], input[type=tel], input[type=url], input[type=number], textarea, select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font: inherit;
    background: #fdfcfb;
    color: var(--text);
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(90,74,122,0.08);
  }
  textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .row2, .row3 { grid-template-columns: 1fr; } }

  /* Radio / checkbox cards */
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  @media (max-width: 560px) { .opt-grid { grid-template-columns: 1fr; } }
  .opt {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fdfcfb;
    cursor: pointer;
    transition: all .15s ease;
    font-size: 13.5px;
  }
  .opt:hover { border-color: var(--purple); background: #faf7f5; }
  .opt input { margin: 2px 0 0; accent-color: var(--purple); }
  .opt.selected { border-color: var(--purple); background: #f0ecf5; }
  .start-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:8px; }
  @media (max-width:760px){ .start-grid { grid-template-columns:1fr; } }
  .start-card {
    border:1px solid var(--border);
    border-radius:8px;
    padding:13px;
    background:#fdfcfb;
    cursor:pointer;
    transition:all .15s ease;
    min-height:112px;
  }
  .start-card:hover { border-color:var(--purple); background:#faf7f5; }
  .start-card.selected { border-color:var(--purple); background:#f0ecf5; box-shadow:0 0 0 2px rgba(90,74,122,.08) inset; }
  .start-card .sc-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--purple); margin-bottom:5px; }
  .start-card .sc-title { font-size:15px; font-weight:800; color:var(--purple-deep); margin-bottom:4px; }
  .start-card .sc-copy { font-size:12px; color:var(--muted); line-height:1.45; }
  .job-seed-grid { display:grid; grid-template-columns:1.2fr .8fr; gap:12px; align-items:start; }
  @media (max-width:760px){ .job-seed-grid { grid-template-columns:1fr; } }
  .job-seed-card { border:1px solid var(--border); border-radius:8px; padding:12px; background:#fffaf4; }
  .job-seed-card .job-title { font-size:15px; font-weight:800; color:var(--purple-deep); margin-bottom:2px; }
  .job-seed-card .job-meta { font-size:12px; color:var(--muted); margin-bottom:8px; line-height:1.45; }
  .job-seed-card .job-angle { font-size:12.5px; color:var(--text); line-height:1.5; }
  .seed-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  /* Tools checkboxes */
  .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 12px; margin-top: 6px; }
  .tool-check { display: flex; align-items: center; gap: 7px; font-size: 13px; padding: 5px 0; }
  .tool-check input { accent-color: var(--purple); }
  .tool-cat { margin-top: 14px; }
  .tool-cat .cat-h {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; text-transform: uppercase; letter-spacing: .1em;
    font-weight: 700; color: var(--purple); margin-bottom: 4px;
  }
  .tool-cat .gap-flag {
    font-size: 9.5px; padding: 2px 7px; border-radius: 10px;
    background: #f7eede; color: var(--gold-deep); border: 1px solid #e9d9bc;
    text-transform: uppercase; letter-spacing: .08em; font-weight: 700;
  }

  /* Job entry */
  .entry {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    background: #fdfcfb;
    position: relative;
  }
  .entry .remove {
    position: absolute; top: 8px; right: 8px;
    background: transparent; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer; padding: 2px 8px; border-radius: 4px;
  }
  .entry .remove:hover { color: var(--red); background: #f5e0e0; }
  .bullet-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .bullet-row textarea { min-height: 38px; }
  .bullet-row .remove-bullet {
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 0 9px; cursor: pointer; color: var(--muted); font-size: 14px;
  }
  .add-btn {
    background: transparent; border: 1px dashed var(--purple); color: var(--purple);
    padding: 8px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600;
    transition: all .15s ease;
  }
  .add-btn:hover { background: #f0ecf5; }

  /* Nav buttons */
  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border);
    gap: 10px;
  }
  .btn {
    padding: 11px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .15s ease;
    font-family: inherit;
  }
  .btn-primary { background: var(--purple); color: #fff; }
  .btn-primary:hover { background: var(--purple-deep); }
  .btn-secondary { background: transparent; border-color: var(--border); color: var(--text); }
  .btn-secondary:hover { border-color: var(--purple); color: var(--purple); }
  .btn-gold { background: var(--gold); color: #fff; }
  .btn-gold:hover { background: var(--gold-deep); }

  /* Archetype card */
  .arch-result {
    background: linear-gradient(135deg, #f0ecf5, #f7eede);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 18px;
  }
  .arch-result .arch-name {
    font-family: 'Playfair Display'; font-weight: 700; font-size: 22px;
    color: var(--purple-deep); margin: 4px 0;
  }
  .arch-result .arch-emoji { font-size: 28px; }
  .arch-result .arch-tagline { font-style: italic; color: var(--text); margin-bottom: 10px; }
  .arch-result .arch-detail { font-size: 13px; color: var(--muted); }
  .arch-result select { margin-top: 10px; max-width: 380px; }

  /* Note */
  .note {
    background: var(--sand); border-left: 3px solid var(--gold);
    padding: 12px 14px; border-radius: 6px; font-size: 13px;
    margin-top: 12px; color: var(--text); line-height: 1.55;
  }
  .note strong { color: var(--purple-deep); }
  .note.warn { background: #f7eede; border-left-color: var(--gold-deep); }
  .note.alert { background: #f5e0e0; border-left-color: var(--red); }
  .note.good { background: #ecf2ee; border-left-color: var(--green); }

  /* Preview / output */
  .preview-wrap {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 38px 44px;
    margin-top: 20px;
    box-shadow: 0 6px 24px rgba(74,58,106,0.10);
    font-size: 11pt;
    line-height: 1.5;
    color: #2a2a2a;
  }
  .download-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .application-pack {
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fdfcfb;
    padding: 14px;
  }
  .application-pack h3 {
    margin: 0 0 4px;
    font-size: 15px;
    color: var(--purple-deep);
  }
  .application-pack p {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .pack-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }
  .pack-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 128px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
  }
  .pack-card strong {
    color: var(--purple-deep);
    font-size: 13px;
  }
  .pack-card span {
    display: block;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.45;
  }
  .pack-card button {
    margin-top: auto;
    width: 100%;
  }
  @media (max-width: 1020px) { .pack-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .pack-grid { grid-template-columns: 1fr; } }
  .readiness-card {
    margin: 14px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    background: #fffaf4;
  }
  .readiness-card.good { background: #f3f8f4; border-color: #d6e5d9; }
  .readiness-card.warn { background: #fff8e6; border-color: #ead9a8; }
  .readiness-card.alert { background: #fff0ee; border-color: #e8c4bd; }
  .readiness-card strong {
    display: block;
    color: var(--purple-deep);
    margin-bottom: 4px;
  }
  .readiness-card p {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }
  .readiness-card ul {
    margin: 6px 0 0 18px;
    padding: 0;
    color: var(--muted);
    font-size: 12.5px;
  }
  .proof-builder {
    margin: 14px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    background: #fdfcfb;
  }
  .proof-builder h3 {
    margin: 0 0 4px;
    color: var(--purple-deep);
    font-size: 15px;
  }
  .proof-builder p {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .proof-output {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    padding: 11px 12px;
    color: var(--purple-deep);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .proof-output strong {
    display: block;
    margin-bottom: 3px;
  }
  .proof-template-note {
    background: var(--sand);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--purple-deep);
    font-size: 12.5px;
    line-height: 1.45;
    margin: 0 0 12px;
    padding: 10px 12px;
  }
  .proof-checklist {
    display: grid;
    gap: 8px;
    margin: 10px 0 12px;
  }
  .proof-check {
    align-items: flex-start;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    display: flex;
    gap: 8px;
    font-size: 12.5px;
    line-height: 1.4;
    padding: 9px 10px;
  }
  .proof-check input {
    margin-top: 2px;
    flex-shrink: 0;
  }

  /* Reference panel */
  .ref-toggle {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-bottom: 8px;
  }
  .ref-panel {
    background: var(--sand); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; margin-bottom: 14px; font-size: 12.5px; line-height: 1.6; display: none;
  }
  .ref-panel.open { display: block; }
  .ref-panel code {
    background: #fff; padding: 1px 5px; border-radius: 3px; font-size: 11.5px;
    color: var(--purple-deep); border: 1px solid var(--border);
  }

  /* Tag pills */
  .pill {
    display: inline-block; padding: 3px 9px;
    background: var(--sand); color: var(--purple-deep);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em;
    margin-right: 6px; margin-bottom: 6px;
  }
  .pill.green { background: #ecf2ee; color: var(--green); border-color: #cfddd5; }
  .pill.gold { background: #f7eede; color: var(--gold-deep); border-color: #e9d9bc; }
  .pill.red { background: #f5e0e0; color: var(--red); border-color: #ebcccc; }

  /* Quiz vote helper */
  .quiz-q { margin-bottom: 18px; }
  .quiz-q .q-text { font-weight: 600; margin-bottom: 6px; }

  /* Helper text */
  .help-mini { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  /* Creative-skill rater (Step 1 Q3) */
  .creative-skill-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 18px;
    margin: 4px 0 6px;
  }
  @media (max-width: 640px) { .creative-skill-list { grid-template-columns: 1fr; } }
  .cs-row {
    display: grid;
    grid-template-columns: 1fr 130px;
    gap: 8px;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .cs-row select { padding: 5px 8px; font-size: 12.5px; }
  .cs-tally {
    display: inline-block; padding: 2px 9px;
    background: var(--sand); color: var(--purple-deep);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 11px; font-weight: 600; margin-left: 8px;
  }
  .cs-tally.hit { background: #ecf2ee; color: var(--green); border-color: #cfddd5; }

  /* Suggested-bullets panel (Step 4 + Step 6) */
  .suggested-bullets {
    margin-top: 10px;
    padding: 12px 14px;
    background: #fdf8ed;
    border: 1px dashed var(--gold);
    border-radius: 8px;
  }
  .suggested-bullets .sb-header {
    font-size: 12px;
    font-weight: 700;
    color: var(--gold-deep);
    margin-bottom: 6px;
    text-transform: none;
    letter-spacing: 0;
  }
  .suggested-bullets .sb-header em {
    color: var(--purple-deep);
    font-style: normal;
    font-weight: 700;
  }
  .suggested-bullets .sb-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sb-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 10px;
    background: #fff;
    border: 1px solid #e9d9bc;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all .15s;
    line-height: 1.45;
    color: var(--text);
  }
  .sb-item:hover {
    background: var(--sand);
    border-color: var(--gold);
    transform: translateX(2px);
  }
  .sb-item .sb-plus {
    flex-shrink: 0;
    font-weight: 700;
    color: var(--gold-deep);

// Map raw job-title strings (and aliases) to BULLET_LIBRARY keys.
function findBulletKey(title) {
  const t = (title||'').toLowerCase();
  if (!t) return null;
  // Owner / founder
  if (/\b(owner|founder|proprietor|self[- ]employed|my business|business owner)\b/.test(t)) return 'owner';
  // EA first (more specific than admin)
  if (/\b(executive assistant|ea\b|chief of staff)/.test(t)) return 'ea';
  // VA / virtual assistant
  if (/\b(virtual assistant|\bva\b|general va|founder va|shopify va|amazon va|real estate va)/.test(t)) return 'va-general';
  // Customer support
  if (/\b(customer (service|support|success)|cs rep|csr\b|help desk|technical support)/.test(t)) return 'cs-rep';
  // BPO / call center
  if (/\b(bpo|call center|call-center|callcenter|agent)/.test(t)) return 'bpo-agent';
  // Social specialist vs manager
  if (/\b(social media manager|smm\b)/.test(t)) return 'social-manager';
  if (/\b(social media|social|community manager)/.test(t)) return 'social-specialist';
  // Content
  if (/\b(content manager|editorial manager|digital content manager)/.test(t)) return 'content-manager';
  if (/\b(content (writer|specialist|marketer)|copywriter|seo specialist|email marketing|marketing coordinator|marketing specialist|digital marketer)/.test(t)) return 'content-writer';
  // Design / video
  if (/\b(graphic designer|brand designer|ui designer|ux designer)/.test(t)) return 'designer';
  if (/\b(video editor|motion designer|reels editor)/.test(t)) return 'video-editor';
  // Sales
  if (/\b(sdr|bdr|sales development|business development|account executive|account manager|sales rep)/.test(t)) return 'sdr';
  // Bookkeeping / accounting
  if (/\b(bookkeeper|accountant|accounting|accounts payable|accounts receivable)/.test(t)) return 'bookkeeper';
  // Teaching / tutoring
  if (/\b(teacher|tutor|instructor|esl|professor)/.test(t)) return 'teacher-tutor';
  // Admin (catch-all)
  if (/\b(administrative|admin|office (manager|administrator|coordinator)|receptionist|secretary|operations coordinator|data entry)/.test(t)) return 'admin';
  return null;
}

function q2Bucket(effective) {
  const n = Math.round(effective * 10) / 10;
  if (effective < 2.5)  return `${n} effective · Fresh Starter zone (target: 5+ work-used)`;
  if (effective < 5)    return `${n} effective · Generalist range`;
  if (effective < 7.5)  return `${n} effective · Transitioner / Solo range`;
  return `${n} effective · Polished / Creative range (top-tier signal — requires real work usage)`;
}

// Parse comma-separated "Other tools" input → de-duped array of tool names
function parseExtras(s) {
  return (s||'').split(',').map(x => x.trim()).filter(Boolean);
}

// Parse Q3 "Other creative tools" textarea: one entry per line, format "Tool Name — level" or "Tool Name - level" or "Tool Name : level"
// level matches: basic|confident|expert (case-insensitive). Default if absent: 'confident'.
function parseQ3OtherEntries(text) {
  const out = [];
  (text||'').split(/\n+/).forEach(line => {
    const m = line.match(/^\s*(.+?)\s*[—\-:]\s*(basic|confident|expert)\s*$/i);
    if (m) {
      out.push({ tool: m[1].trim(), level: m[2].toLowerCase() });
    } else {
      const bare = line.trim();
      if (bare) out.push({ tool: bare, level: 'confident' });
    }
  });
  return out;
}

function applySharedContextToState() {
  const params = new URLSearchParams(window.location.search);
  const incomingArch = params.get('archetype');
  const incomingStart = params.get('start');
  const incomingRole = params.get('role');
  const incomingJob = params.get('job');
  const shared = window.BFF ? window.BFF.readState() : {};
  const arch = incomingArch || shared.archetype;
  if (arch && ARCHETYPES[arch]) {
    state.archetype = arch;
    state.archetypeOverride = arch;
    state.finderResult = Object.assign({}, state.finderResult || {}, { archetype: arch });
    if (incomingStart === 'archetype' && !state.target.templateKey && !state.target.selectedJobId) {
      state.startMode = 'template';
    }
  }
  if (incomingJob) {
    state.startMode = 'job';
    state.target.selectedJobId = incomingJob;
  }
  const roleId = incomingRole || shared.recommendedRoleId || shared.targetRoleId || '';
  const role = roleId ? (window.BFF && window.BFF.roleById(roleId)) : null;
  if (role) {
    state.target.targetRoleId = role.id;
    if (!incomingJob) {
      state.target.jobTitle = role.title;
      state.target.company = 'BFF recommended role';
      state.target.selectedJobResumeAngle = role.resumeAngle;
      state.target.jd = `${role.title}\nTools: ${role.tools.join(', ')}\nWork sample to build: ${role.proofSample}`;
      state.startMode = 'template';
    }
    if (window.BFF) window.BFF.writeState({ targetRoleId: role.id, recommendedRoleId: role.id, targetRole: role.title });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const loaded = JSON.parse(raw);
      // Migrate legacy q2_tools array (binary checks) → q2_levels object (default to 'expert')
      if (loaded.quiz && Array.isArray(loaded.quiz.q2_tools) && !loaded.quiz.q2_levels) {
        loaded.quiz.q2_levels = {};
        loaded.quiz.q2_tools.forEach(t => { loaded.quiz.q2_levels[t] = 'expert'; });
        delete loaded.quiz.q2_tools;
      }
      const base = emptyState();
      const merged = Object.assign(base, loaded);
      merged.quiz = Object.assign(base.quiz, loaded.quiz || {});
      merged.target = Object.assign(base.target, loaded.target || {});
      merged.proofDraft = Object.assign(base.proofDraft, loaded.proofDraft || {});
      if (!merged.startMode) merged.startMode = merged.target.selectedJobId ? 'job' : 'template';
      if (merged.startMode === 'archetype') merged.startMode = 'template';
      return merged;
    }
  } catch(e) { console.warn('localStorage load failed', e); }
  return emptyState();
}

          proofStatus: state.projects && state.projects.length ? 'started' : 'missing',

        });
      }

    } catch(e) { setSaveState('error'); console.warn('save failed', e); }
  }, 250);
}

    'notion': 'Notion',
    'trello': 'Trello',
    'asana': 'Asana',
    'clickup': 'ClickUp',
    'shopify': 'Shopify',
    'quickbooks': 'QuickBooks',
    'xero': 'Xero',
    'mailchimp': 'Mailchimp',
    'klaviyo': 'Klaviyo',
    'zendesk': 'Zendesk',
    'intercom': 'Intercom',
    'freshdesk': 'Freshdesk'
  };
  if (aliases[clean]) return aliases[clean];
  return TOOL_CATEGORIES.flatMap(c => c.tools).find(t => t.toLowerCase() === clean) || '';
}

function syncKeywordsToSkills(keywords) {
  String(keywords || '').split(',').map(s => s.trim()).filter(Boolean).forEach(term => {
    const tool = normalizeToolName(term);
    const cat = tool ? TOOL_TO_CATEGORY[tool] : '';
    if (!cat) return;
    state.skills[cat] = state.skills[cat] || [];
    if (!state.skills[cat].includes(tool)) state.skills[cat].push(tool);
    state.quiz.q2_levels[tool] = state.quiz.q2_levels[tool] || 'confident';
  });
}

function starterSummaryFromJob(job) {
  const role = job.title || job.role_lala_category || 'remote role';
  const keywords = String(job.resume_keywords || '').split(',').map(s => s.trim()).filter(Boolean).slice(1, 4).join(', ');
  const arch = archetypeKeyFromLabel(job.archetype_primary);
  if (arch === 'transitioner') {
    return `Seeking to bring [N] years of professional experience to a ${role} position. Well-versed in ${keywords || '[transferable skills]'}, proven through [specific achievement from your current or previous role]. Available [schedule] with [Mbps] connection.`;
  }
  if (arch === 'fresh') {
    return `Entry-level remote-work learner preparing for ${role} work. Practicing ${keywords || '[tools from the job post]'} through [course, project, or volunteer proof]. Available [hours/week] with [Mbps] connection.`;
  }
  if (arch === 'solo') {
    return `Former business operator applying customer, operations, and follow-up experience to a ${role} position. Familiar with ${keywords || '[tools from the job post]'} and able to show proof through [orders, customers, revenue, or workflow examples].`;
  }
  return `${role} candidate focused on ${job.resume_angle ? job.resume_angle.replace(/^Position your resume around /i, '') : 'clear execution, reliable communication, and role-matched proof'}. Experienced with ${keywords || '[tools from the job post]'}.`;
}

function starterBulletsFromJob(job) {
  const role = [job.title, job.role_lala_category].filter(Boolean).join(' ').toLowerCase();
  if (role.includes('marketing') || role.includes('growth') || role.includes('campaign')) {
    return [
      'Coordinated [N] marketing tasks across [channels] while tracking owners, deadlines, and status updates in [tool]',
      'Prepared campaign materials, reports, or content drafts using [tool] and followed a clear review process',
      'Organized audience, lead, or content data in [spreadsheet/CRM] so the team could act on next steps'
    ];
  }
  if (role.includes('customer')) {
    return [
      'Handled [N] customer requests per day while maintaining clear notes, timely follow-ups, and professional written updates',
      'Tracked recurring customer issues and escalated unresolved items with complete context for faster resolution',
      'Used [tool] to organize requests, update statuses, and keep service conversations moving'
    ];
  }
  if (role.includes('content') || role.includes('community') || role.includes('seo')) {
    return [
      'Created and organized [N] pieces of content for [platform/audience] using [tool] and a repeatable content workflow',
      'Repurposed source material into posts, captions, or updates while keeping voice, formatting, and deadlines consistent',
      'Tracked content tasks, approvals, and publishing status in [tool] so nothing was missed'
    ];
  }
  if (role.includes('executive') || role.includes('assistant') || role.includes('virtual')) {
    return [
      'Managed incoming requests, schedules, files, and follow-ups using [tool] with [N]% on-time completion',
      'Organized documents, trackers, and admin details so the client could see priorities and next actions clearly',
      'Drafted clear updates, reminders, and handoffs for [team/client] using professional written English'
    ];
  }
  return [
    'Translated past experience into role-relevant proof for [target task], using [tool] and a clear follow-up process',
    'Maintained accurate records, organized next actions, and communicated status updates for [workflow/project]',
    'Completed [N] deliverables while following instructions, checking details, and documenting outcomes'
  ];
}

function seedStarterResume(job) {
  if (!job) return;
  state.summary = state.summary || starterSummaryFromJob(job);
  if (!state.experience.length && currentArchetype() !== 'fresh') {
    state.experience.push({
      title: '[Current or previous role]',
      company: '[Company or Self-employed]',
      location: 'Remote / Philippines',
      startDate: '[Start]',
      endDate: '[End or Present]',
      bullets: starterBulletsFromJob(job)
    });
  }
  if (currentArchetype() === 'fresh' && !state.projects.length) {
    state.projects.push({
      name: `${job.role_lala_category || job.title} practice proof`,
      description: 'Self-directed sample based on the target job. Replace this with a real course project, volunteer task, school task, household system, or practice output you can explain honestly.',
      scale: '[N tasks, files, rows, posts, or hours]',
      tools: String(job.resume_keywords || '').split(',').slice(1, 4).map(s => s.trim()).join(', ')
    });
  }
}

async function pickLiveJob(id) {
  const summary = jobBoardJobs.find(j => j.id === id);
  if (!summary) return;
  let detail = summary;
  try {
    const res = await fetch(`../jobs/data/${id}.json`);
    if (res.ok) detail = await res.json();
  } catch(e) {
    console.warn('job detail load failed', e);
  }
  state.startMode = 'job';
  state.target.selectedJobId = id;
  state.target.selectedJobUrl = detail.apply_url || summary.apply_url || '';
  state.target.selectedJobResumeKeywords = detail.resume_keywords || summary.resume_keywords || '';
  state.target.selectedJobResumeAngle = detail.resume_angle || summary.resume_angle || '';
  state.target.selectedJobSource = detail.source || detail.ats_platform || summary.source || summary.ats_platform || '';
  const catalogRole = window.BFF ? window.BFF.roleForTitle(detail.role_lala_category || summary.role_lala_category || detail.title || summary.title || '') : null;
  state.target.targetRoleId = catalogRole ? catalogRole.id : state.target.targetRoleId;
  state.target.templateKey = '';
  state.target.jobTitle = detail.title || summary.title || '';
  state.target.company = detail.company || summary.company || '';
  state.target.jd = detail.clean_description || detail.raw_description || summary.why_it_fits || '';
  const archKey = archetypeKeyFromLabel(detail.archetype_primary || summary.archetype_primary);
  if (archKey) {

    state.archetype = archKey;
  }
  syncKeywordsToSkills(state.target.selectedJobResumeKeywords);
  seedStarterResume(detail);

  render();

function resetAll() {
  if (!confirm('Reset everything and start over? Cannot be undone.')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = emptyState();
  render();
}

/* =========================================================
   ARCHETYPE SCORING
   ========================================================= */
function scoreArchetype(q) {
  const v = { polished:0, transitioner:0, creative:0, solo:0, generalist:0, fresh:0 };
  // Q1 background
  switch (q.q1) {
    case 'freelance': v.polished+=3; break;
    case 'corporate': v.transitioner+=3; break;
    case 'bpo': v.transitioner+=2; break;
    case 'business': v.solo+=3; break;
    case 'creative': v.creative+=3; break;
    case 'school': v.fresh+=3; break;
    case 'none': v.generalist+=2; break;
  }
  // Q2 — weighted tool count (Expert=1.0, Confident=0.7, Basic=0.3). Other-extras default to Expert.
  const effective = q2EffectiveCount(q.q2_levels);
  if (effective < 2.5)        { v.fresh+=3; }
  else if (effective < 5)     { v.generalist+=2; v.solo+=1; }
  else if (effective < 7.5)   { v.transitioner+=2; v.solo+=2; }
  else                        { v.polished+=3; v.creative+=2; }
  // Bonus: a candidate with 5+ EXPERT (work-used) tools is a clear Polished/Transitioner signal
  const t = q2TalliedCount(q.q2_levels);
  if (t.expert >= 5) { v.polished+=1; v.transitioner+=1; }

  // Q3 — Creative lift triggered by ANY confident-or-expert rating
  const creativeLevels = Object.values(q.q3_creative||{});
  const hasConfident = creativeLevels.some(l => l === 'confident' || l === 'expert');
  const expertCount = creativeLevels.filter(l => l === 'expert').length;
  if (hasConfident) { v.creative+=3; v.polished+=1; }
  if (expertCount >= 2) { v.creative+=1; }  // power-user bonus

  // Q4 shift
  switch (q.q4) {
    case 'day': v.polished+=1; v.solo+=2; break;
    case 'night': v.transitioner+=3; break;
    case 'flexible': v.polished+=2; v.generalist+=1; break;
    case 'parttime': v.solo+=2; v.fresh+=1; break;
  }
  // Q5 english
  switch (q.q5) {
    case '1': case '2': v.fresh+=3; break;
    case '3': v.generalist+=1; v.solo+=1; v.fresh+=1; break;
    case '4': v.transitioner+=2; v.generalist+=2; break;
    case '5': v.polished+=3; v.creative+=2; v.transitioner+=1; break;
  }
  // Q6a — remote / freelance years (stronger signal for Polished)
  switch (q.q6_remote) {
    case '6+':  v.polished+=3; break;
    case '3-5': v.polished+=2; v.generalist+=1; break;
    case '1-2': v.polished+=1; break;
  }
  // Q6b — corporate / office / BPO years (signal for Transitioner)
  switch (q.q6_corporate) {
    case '6+':  v.transitioner+=3; break;
    case '3-5': v.transitioner+=2; v.generalist+=1; break;
    case '1-2': v.transitioner+=1; break;
  }
  // Both empty / zero → Fresh signal (only if user actually answered)
  if (q.q6_remote === '0' && q.q6_corporate === '0') { v.fresh+=3; }

  // pick top
  let best = 'generalist', max = 0;
  for (const k in v) {
    if (v[k] > max) { max = v[k]; best = k; }
  }
  return { winner: best, votes: v };
}

function quizFilled(q) {
  // Archetype surfaces once the 5 single-choice questions are answered.
  // Q2 (checkboxes) and Q3 (selects) are optional inputs — empty is a valid signal (fresh).
  return !!q.q1 && !!q.q4 && !!q.q5 && !!q.q6_remote && !!q.q6_corporate;
}

  c.innerHTML = '';
  c.innerHTML = renderStarterWorkbench();
  bindHandlers();

function renderStepbar() {
  const sb = document.getElementById('stepbar');
  sb.innerHTML = '<div class="step active" title="Resume starter"></div>';
}

function currentCatalogRole() {
  if (!window.BFF) return null;
  if (state.target.targetRoleId) {
    const direct = window.BFF.roleById(state.target.targetRoleId);
    if (direct) return direct;
  }
  const selectedJob = selectedJobSummary();
  const titleCandidates = [
    state.target.jobTitle,
    selectedJob && selectedJob.role_lala_category,
    selectedJob && selectedJob.archetype_primary
  ].filter(Boolean);
  const matched = titleCandidates.map(title => window.BFF.roleForTitle(title)).find(Boolean);
  if (matched) return matched;
  return window.BFF.rolesForArchetype(currentArchetype())[0] || null;
}

function readinessVerdict(audit, role) {
  const proofReady = !!firstProofBullet() || (state.projects || []).some(project => project.description || project.name);
  if (audit.score >= 8.5 && proofReady) {
    return {
      cls: 'good',
      label: 'Apply now',
      message: 'The resume has enough proof to start applying. Keep tailoring the title, keywords, and first bullet for each job.'
    };
  }
  if (audit.score >= 7) {
    return {
      cls: 'warn',
      label: 'Build one work sample first',
      message: role ? `The resume is close, but this role needs visible proof before outreach feels credible.` : 'The resume is close, but it still needs one concrete proof action before outreach.'
    };
  }
  return {
    cls: 'alert',
    label: 'Choose an easier role first',
    message: role ? `This target is still too exposed for the current proof level. Use the proof action below, or pick a simpler recommended role before applying.` : 'This target is too exposed for the current proof level. Add tools, quantified bullets, and one work sample before applying.'
  };
}

function proofDraftBullet(role) {
  const draft = state.proofDraft || {};
  const roleTitle = role ? role.title : (state.target.jobTitle || 'target role');
  const template = role && role.proofTemplate ? role.proofTemplate : null;
  const output = draft.output || (template ? template.output : (role ? role.proofSample : 'role-matched work sample'));
  const metric = draft.metric || '[number or scope]';
  const tools = role ? role.tools.slice(0, 3).join(', ') : '[tools]';
  if (template && template.resumeBullet) {
    return template.resumeBullet
      .replace('[metric]', metric)
      .replace('[output]', output)
      .replace('[role]', roleTitle)
      .replace('[tools]', tools);
  }
  return `Built ${metric} by creating ${output} for a ${roleTitle} practice brief, using ${tools} to show clear follow-through.`;
}

        <div class="edit-grid">

            </div>
            <div class="pack-card">
              <strong>OnlineJobs.ph profile</strong>
              <span>Client-friendly summary with availability, tools, internet speed, and role fit.</span>
              <button class="btn btn-secondary" onclick="copyOnlineJobsProfile()">Copy OLJ profile</button>
            </div>
            <div class="pack-card">
              <strong>Email pitch</strong>
              <span>Direct outreach note for a specific job post or hiring manager.</span>
              <button class="btn btn-secondary" onclick="copyEmailPitch()">Copy email pitch</button>
            </div>

              <strong>Short proposal</strong>
              <span>Compact reply for Upwork, Facebook leads, and quick application forms.</span>
              <button class="btn btn-secondary" onclick="copyShortProposal()">Copy short proposal</button>

        <div class="download-row">
          <button class="btn btn-primary" onclick="downloadHTML()">Download resume file</button>
          <button class="btn btn-secondary" onclick="copyPlain()">Copy plain text</button>
        </div>

        <div class="next-step-band">
          <a href="../lesson-bpo-to-va-portfolio/index.html">Build a work sample<small>Use a small proof project when the resume claim is weak.</small></a>
          <button type="button" onclick="copyEmailPitch()">Customize outreach<small>Start from the same target job and proof points.</small></button>

    <style media="print">
      @page { size: letter; margin: 0.5in; }

    </style>
  `;
}

function renderInlineExperienceEditor() {
  if (!state.experience.length) return `
    <div class="note">No experience block yet. Create a resume draft, or add one role below.</div>
    <button class="add-btn" onclick="addEntry('experience')">Add role</button>
  `;
  return state.experience.slice(0, 1).map((e, i) => `
    <div class="entry" data-i="${i}">
      <div class="compact-row">
        <label class="field"><span class="lbl">Role</span><input type="text" data-bind="experience.${i}.title" value="${esc(e.title)}"></label>
        <label class="field"><span class="lbl">Company</span><input type="text" data-bind="experience.${i}.company" value="${esc(e.company)}"></label>
      </div>
      <label class="field"><span class="lbl">Proof bullets</span></label>
      ${(e.bullets || []).slice(0, 4).map((b, bi) => `
        <div class="bullet-row">
          <textarea data-bullet="${i}.${bi}" rows="2">${esc(b)}</textarea>
          <button class="remove-bullet" onclick="removeBullet(${i},${bi})">x</button>
        </div>
      `).join('')}
      <button class="add-btn" onclick="addBullet(${i})">Add bullet</button>
    </div>
  `).join('');
}

function createStarterResume() {
  updateStarterInputs();
  if (!state.target.jobTitle) {
    alert('Add a target job title first.');
    return;
  }
  const jobLike = {
    title: state.target.jobTitle,
    company: state.target.company,
    role_lala_category: state.target.jobTitle,
    archetype_primary: ARCHETYPES[currentArchetype()].name,
    resume_keywords: state.target.selectedJobResumeKeywords || extractKeywords(state.target.jd).slice(0, 6).map(k => k.term).join(', '),
    resume_angle: state.target.selectedJobResumeAngle || ''
  };
  if (!state.personal.headline) state.personal.headline = suggestHeadline();
  state.summary = state.summary || starterSummaryFromJob(jobLike);
  seedStarterResume(jobLike);
  saveState();
  render();
}

function updateStarterInputs() {
  const targetTitle = document.getElementById('targetTitle');
  const targetCompany = document.getElementById('targetCompany');
  const targetJD = document.getElementById('targetJD');
  const summaryInput = document.getElementById('summaryInput');
  const name = document.getElementById('p_name');
  const email = document.getElementById('p_email');
  const speed = document.getElementById('p_speed');
  const hours = document.getElementById('p_hours');
  if (targetTitle) state.target.jobTitle = targetTitle.value.trim();
  if (targetCompany) state.target.company = targetCompany.value.trim();
  if (targetJD) state.target.jd = targetJD.value.trim();
  if (summaryInput) state.summary = summaryInput.value.trim();
  if (name) state.personal.name = name.value.trim();
  if (email) state.personal.email = email.value.trim();
  if (speed) state.personal.internetSpeed = speed.value.trim();
  if (hours) state.personal.hoursPerWeek = hours.value;
}

/* ---------- STEP 1: Resume setup ---------- */
function renderStartChooser() {
  const mode = state.startMode || 'job';
  const selectedJob = selectedJobSummary();
  const jobs = [...jobBoardJobs].sort((a,b) => {
    const fit = Number(b.fit_score || 0) - Number(a.fit_score || 0);
    return fit || String(b.posted || '').localeCompare(String(a.posted || ''));
  });
  return `
    <div class="quiz-q">
      <div class="q-text">1. How do you want to start?</div>
      <p class="help-mini">Choose the strongest source for this resume. You can still edit every section later.</p>
      <div class="start-grid">
        <div class="start-card ${mode==='job'?'selected':''}" onclick="setStartMode('job')">
          <div class="sc-label">Best default</div>
          <div class="sc-title">Start with a desired job</div>
          <div class="sc-copy">Pick a real BFF job or a target role. The builder will use the job keywords, angle, and editable starter bullets.</div>
        </div>
        <div class="start-card ${mode==='resume'?'selected':''}" onclick="setStartMode('resume')">
          <div class="sc-label">Already has resume</div>
          <div class="sc-title">Start from existing resume</div>
          <div class="sc-copy">Paste the old resume as source material. We keep facts visible so the starter does not invent experience.</div>
        </div>
        <div class="start-card ${mode==='archetype'?'selected':''}" onclick="setStartMode('archetype')">
          <div class="sc-label">Direction first</div>
          <div class="sc-title">Start with archetype</div>
          <div class="sc-copy">Use this when there is no target job yet. The resume follows the path from the Archetype Finder.</div>
        </div>
      </div>
    </div>

    ${mode === 'job' ? `
      <div class="quiz-q">
        <div class="q-text">2. Pick the job this resume should chase.</div>
        <div class="job-seed-grid">
          <label class="field">
            <span class="lbl">BFF Job Board role</span>
            <span class="hint">${jobBoardJobs.length ? `${jobBoardJobs.length} current jobs loaded. Pick one to prefill target role, keywords, and resume angle.` : 'Loading current jobs from the BFF Job Board.'}</span>
            <select id="liveJobSelect">
              <option value="">Choose a current job</option>
              ${jobs.map(j => `<option value="${esc(j.id)}" ${state.target.selectedJobId===j.id?'selected':''}>${esc(j.title)} · ${esc(j.company)} · ${esc(j.archetype_primary || 'Generalist Admin')}</option>`).join('')}
            </select>
          </label>
          <div class="job-seed-card">
            ${selectedJob ? `
              <div class="job-title">${esc(selectedJob.title)}</div>
              <div class="job-meta">${esc(selectedJob.company)} · ${esc(selectedJob.role_lala_category || 'Remote role')} · ${esc(selectedJob.ph_eligible || 'Likely')} PH</div>
              <div class="job-angle">${esc(selectedJob.resume_angle || 'Use the job post keywords to shape the resume.')}</div>
              <div class="seed-actions">
                <button class="btn btn-primary" onclick="pickLiveJob('${esc(selectedJob.id)}')">Create editable starter</button>
                <a class="btn btn-secondary" href="../jobs/index.html#job/${esc(selectedJob.id)}">View job</a>
              </div>
            ` : `
              <div class="job-title">No job selected yet</div>
              <div class="job-meta">Choose a role from the list, then create a starter resume.</div>
              <div class="job-angle">The starter will fill target title, company, job description, keywords, skills, summary prompt, and editable proof bullets.</div>
            `}
          </div>
        </div>
        <div class="note" style="margin-top:12px;">
          This does not submit an application. It gives the student a draft they can edit, remove from, and fact-check against their real experience.
        </div>
      </div>
    ` : ''}

    ${mode === 'resume' ? `
      <div class="quiz-q">
        <div class="q-text">2. Paste the existing resume as source material.</div>
        <label class="field">
          <span class="lbl">Existing resume text</span>
          <span class="hint">Paste the old resume here. We will use it as a fact bank while the editable sections below become the new resume.</span>
          <textarea id="existingResumeInput" rows="10" placeholder="Paste current resume text here">${esc(state.existingResume || '')}</textarea>
        </label>
        <div class="note">
          Lesson bridge: transferable skills work when they are translated honestly. Keep old facts, then rewrite the framing for the target job.
          <a href="../lesson-bpo-to-va-portfolio/index.html#the-bpo-to-va-skill-map">Read the BPO-to-VA skill map</a>.
        </div>
      </div>
    ` : ''}
  `;
}

function renderStep1() {
  const q = state.quiz;
  const selectedArch = currentArchetype();
  const result = ARCHETYPES[selectedArch];
  const finderSaved = state.finderResult && state.finderResult.archetype;
  const jobSeeded = state.target && (state.target.selectedJobId || state.target.templateKey);
  const archNote = jobSeeded
    ? '<div class="note good" style="margin-top:12px;">Recommended from the selected job or role template. You can keep it or choose a different resume path below.</div>'
    : finderSaved
      ? '<div class="note good" style="margin-top:12px;">Imported from the Archetype Finder. You can keep it or choose a different resume path below.</div>'
      : '<div class="note" style="margin-top:12px;">Not sure yet? <a href="../archetype/index.html">Open the Archetype Finder</a>, then come back here to build the resume.</div>';

  return `
    <div class="card">
      <div class="eyebrow">Step 1 of 7</div>
      <h1>Resume setup</h1>
      <p class="lede">Start with the clearest source: a job you want, an existing resume, or an archetype. Then list only the tools strong enough to defend on a resume.</p>

      ${renderStartChooser()}

      <div class="quiz-q">
        <div class="q-text">${state.startMode === 'archetype' ? '2' : '3'}. Which archetype should this resume use?</div>
        <p class="help-mini">This controls the role templates, soft-skill suggestions, section order, and resume audit. You can change it later.</p>
        <div class="arch-result">
          <div class="arch-name">${result.name}</div>
          <div class="arch-tagline">${result.tag}</div>
          <div class="arch-detail">Share of pool: ${result.share} · Proceed-to-interview rate: ${result.proceed}</div>
          ${archNote}
          <select id="archOverride" aria-label="Resume archetype">
            ${Object.keys(ARCHETYPES).map(k => `<option value="${k}" ${selectedArch===k?'selected':''}>${ARCHETYPES[k].name}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="quiz-q">
        <div class="q-text">${state.startMode === 'archetype' ? '3' : '4'}. Rate the tools you can defend on a resume.</div>
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.55;">
          Gap categories are high-leverage when you have real experience. Levels:<br>
          <strong>Basic</strong> = heard of it, never used at work · <strong>Confident</strong> = explored on my own · <strong>Expert</strong> = used at work
        </div>
        ${ QUICK_TOOLS_GROUPED.map(g => {
          const isNone = !!(q.q2_none||{})[g.key];
          const tally = q2TalliedCount(Object.fromEntries(g.tools.map(t => [t, (q.q2_levels||{})[t]]).filter(([_,v])=>v)));
          return `
          <div class="tool-cat-q2 ${isNone?'is-none':''}" style="margin-bottom:6px;">
            <div style="font-size:11px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              <span>${g.cat}</span>
              ${ tally.expert ? `<span style="font-size:10px;padding:2px 7px;border-radius:10px;background:#ecf2ee;color:var(--green);border:1px solid #cfddd5;font-weight:700;">${tally.expert} expert</span>` : '' }
              ${ tally.confident ? `<span style="font-size:10px;padding:2px 7px;border-radius:10px;background:#f0ecf5;color:var(--purple);border:1px solid #d7d1e0;font-weight:700;">${tally.confident} confident</span>` : '' }
            </div>
            <div class="q2-skill-list">
              ${ g.tools.map(t => {
                const lvl = (q.q2_levels||{})[t] || '';
                return `
                <div class="q2-row">
                  <div class="tool-name">${t}</div>
                  <select data-q2-tool="${esc(t)}" data-q2-cat="${esc(g.key)}" data-level="${lvl}" ${isNone?'disabled':''}>
                    <option value=""           ${!lvl?'selected':''}>None / Never heard</option>
                    <option value="basic"      ${lvl==='basic'?'selected':''}>Basic, heard of it</option>
                    <option value="confident"  ${lvl==='confident'?'selected':''}>Confident, self-taught</option>
                    <option value="expert"     ${lvl==='expert'?'selected':''}>Expert, used at work</option>
                  </select>
                </div>`;
              }).join('') }
            </div>
            <div class="cat-extras">
              <div class="none-row">
                <label class="tool-check" style="white-space:nowrap;">
                  <input type="checkbox" data-q2-none="${esc(g.key)}" ${isNone?'checked':''}>
                  <em>None of these</em>
                </label>
              </div>
              <div class="other-row">
                <span class="lbl-other">+ Other:</span>
                <input type="text" class="q2-other-input"
                       data-q2-other="${esc(g.key)}"
                       placeholder="Tools we didn't list (comma-separated; assumed Expert, used at work)"
                       value="${esc((q.q2_other||{})[g.key]||'')}"
                       ${isNone?'disabled':''}>
              </div>
            </div>
          </div>
        `;
        }).join('') }
        ${ (() => {
          const eff = q2EffectiveCount(q.q2_levels);
          const t = q2TalliedCount(q.q2_levels);
          return `
          <div class="q2-tally">
            <div class="num">${(Math.round(eff*10)/10)}</div>
            <div class="lbl">${q2Bucket(eff)}</div>
            <div class="breakdown">
              <span class="b-chip expert">Expert: ${t.expert}</span>
              <span class="b-chip confident">Confident: ${t.confident}</span>
              <span class="b-chip basic">Basic: ${t.basic}</span>
            </div>
          </div>`;
        })() }
      </div>

      <div class="quiz-q">
        <div class="q-text">${state.startMode === 'archetype' ? '4' : '5'}. Add creative tools only if they strengthen the resume.</div>
        <p class="help-mini">Use this for design, photo, video, and social-media tools that support the role you are targeting.</p>
        ${ CREATIVE_TOOLS_BY_GROUP.map(g => {
          const groupKey = g.group.replace(/[^a-z]/gi,'').toLowerCase();
          const hits = g.tools.filter(t => ['confident','expert'].includes((q.q3_creative||{})[t])).length;
          const isGroupNone = !!(q.q3_none||{})[groupKey];
          return `
            <div style="margin-top:10px;${isGroupNone?'opacity:0.6;':''}">
              <div style="font-size:12px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <span>${g.group}</span>
                ${hits > 0 ? `<span class="cs-tally hit">${hits} confident+</span>` : `<span class="cs-tally">${hits}</span>`}
                <label style="font-size:11px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:4px;margin-left:auto;">
                  <input type="checkbox" data-q3-none="${esc(groupKey)}" ${isGroupNone?'checked':''}>
                  <em>None of this group</em>
                </label>
              </div>
              <div class="creative-skill-list">
                ${ g.tools.map(t => `
                  <div class="cs-row">
                    <div class="cs-tool">${t}</div>
                    <select data-q3-tool="${esc(t)}" ${isGroupNone?'disabled':''}>
                      <option value="" ${!(q.q3_creative||{})[t]?'selected':''}>None</option>
                      <option value="basic" ${(q.q3_creative||{})[t]==='basic'?'selected':''}>Basic</option>
                      <option value="confident" ${(q.q3_creative||{})[t]==='confident'?'selected':''}>Confident</option>
                      <option value="expert" ${(q.q3_creative||{})[t]==='expert'?'selected':''}>Expert</option>
                    </select>
                  </div>
                `).join('') }
              </div>
            </div>
          `;
        }).join('') }
        <div class="q3-other-row">
          <label>Other creative tools we didn't list (one per line: <code>Tool Name - Confident</code>)</label>
          <textarea data-q3-other placeholder="Affinity Photo - Confident&#10;ManyChat - Expert&#10;Davinci Fusion - Basic">${esc(q.q3_other||'')}</textarea>
        </div>
      </div>

      <div class="nav-row">
        <a class="btn btn-secondary" href="../archetype/index.html">Open Archetype Finder</a>
        <button class="btn btn-primary" onclick="step1Next()">Continue →</button>
      </div>
    </div>
  `;
}

async function step1Next() {
  const existing = document.getElementById('existingResumeInput');
  if (existing) state.existingResume = existing.value.trim();
  if (state.startMode === 'job' && state.target.selectedJobId && !state.target.jobTitle) {
    await pickLiveJob(state.target.selectedJobId);
    return;
  }
  state.archetype = currentArchetype();
  go(2);
}

/* ---------- STEP 2: Target role + JD ---------- */
function renderStep2() {
  const arch = ARCHETYPES[currentArchetype()];
  const a = currentArchetype();
  const tplOpen = state._tplOpen !== false;  // default open on first visit
  const recommended = JOB_TEMPLATES.filter(t => t.archetypeHint.includes(a));
  const others = JOB_TEMPLATES.filter(t => !t.archetypeHint.includes(a));
  const orderedTemplates = [...recommended, ...others];
  const selectedKey = state.target.templateKey;

  return `
    <div class="card">
      <div class="eyebrow">Step 2 of 7</div>
      <h1>Target role</h1>
      <p class="lede">Pick a ready-made template that matches the kind of role you want, or paste a job description you found online.</p>

      <div class="note">
        Building for: <strong>${arch.emoji} ${arch.name}</strong>
        ${state.target.selectedJobResumeAngle ? `<br><strong>Resume angle:</strong> ${esc(state.target.selectedJobResumeAngle)}` : ''}
        ${state.existingResume ? `<br><strong>Source resume:</strong> pasted in Step 1. Use it as the fact bank while editing this draft.` : ''}
      </div>

      <div class="templates-toggle ${tplOpen?'open':''}" onclick="toggleTemplates()">
        <div>
          <div class="tt-label">📚 Ready-made job templates</div>
          <div class="tt-hint">${recommended.length} recommended for ${arch.emoji} ${arch.name.replace('The ','')} · ${JOB_TEMPLATES.length} total</div>
        </div>
        <div class="tt-caret">›</div>
      </div>

      ${ tplOpen ? `
        <div class="templates-grid">
          ${ orderedTemplates.map(t => {
            const isRecommended = t.archetypeHint.includes(a);
            return `
              <div class="template-card ${selectedKey===t.key?'selected':''}" onclick="pickTemplate('${t.key}')">
                ${isRecommended ? '<span class="pill green" style="position:absolute;top:8px;right:8px;font-size:9px;padding:1px 7px;">Recommended</span>' : ''}
                <div class="tpl-emoji">${t.emoji}</div>
                <div class="tpl-title">${esc(t.title)}</div>
                <div class="tpl-meta"><span class="pay">${esc(t.payShort)}</span></div>
                <div class="tpl-meta">${esc(t.scheduleShort)}</div>
                <div class="tpl-tools">${esc(t.toolsShort)}</div>
                <div class="tpl-pick">${selectedKey===t.key?'✓ Selected':'Use this template →'}</div>
              </div>`;
          }).join('') }
        </div>
      ` : '' }

      <label class="field">
        <span class="lbl">Target job title <span style="color:var(--red)">*</span></span>
        <span class="hint">Picked a template? This is auto-filled. Otherwise type your own.</span>
        <input type="text" id="targetTitle" value="${esc(state.target.jobTitle)}" placeholder="Virtual Assistant — Social Media + Admin">
      </label>

      <label class="field">
        <span class="lbl">Target company (optional)</span>
        <span class="hint">If you have a specific company in mind. Otherwise leave blank.</span>
        <input type="text" id="targetCompany" value="${esc(state.target.company)}" placeholder="Acme Co · or leave blank">
      </label>

      <label class="field">
        <span class="lbl">Job description ${selectedKey?'<span style="color:var(--gold-deep);font-size:11px;font-weight:700;">· Template prefilled — edit freely</span>':''}</span>
        <span class="hint">Paste the whole listing. We'll mine it for keywords later. If you used a template above, edit it to match the specific company you're applying to.</span>
        <textarea id="targetJD" rows="14">${esc(state.target.jd)}</textarea>
      </label>

      ${ state.target.jd && state.target.jd.length > 100 ? renderKeywordPreview(state.target.jd) : ''}

      <div class="nav-row">
        <button class="btn btn-secondary" onclick="go(1)">← Back</button>
        <button class="btn btn-primary" onclick="step2Next()">Continue →</button>
      </div>
    </div>
  `;
}

function toggleTemplates() {
  state._tplOpen = state._tplOpen === false ? true : false;
  saveState();
  render();

function renderKeywordPreview(jd) {

  return `

      <div style="margin-top:6px;">${kw.slice(0,12).map(k=>`<span class="pill green">${k.term}</span>`).join('')}</div>
      <div class="help-mini" style="margin-top:6px;">Tip: work these into your bullets and skills section.</div>
    </div>`;
}

function extractKeywords(text) {
  const stop = new Set(['the','and','to','of','a','in','for','is','with','on','as','our','will','you','your','at','by','be','an','this','that','have','from','or','we','are','it','if','can','team','role','job','work','years','experience','required','candidates','candidate']);
  const words = (text || '').toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w => w.length>3 && !stop.has(w));
  const freq = {};
  words.forEach(w => freq[w] = (freq[w]||0)+1);
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).map(([term,count])=>({term,count}));
}

function addSuggestedBullet(entryIdx, bulletKey, suggestionIdx) {
  const suggestion = (BULLET_LIBRARY[bulletKey] || [])[suggestionIdx];

  // Replace the first blank bullet if there's one — otherwise append
  const blankIdx = state.experience[entryIdx].bullets.findIndex(b => !b || !b.trim());
  if (blankIdx >= 0) state.experience[entryIdx].bullets[blankIdx] = suggestion;
  else state.experience[entryIdx].bullets.push(suggestion);
  saveState();
  render();
}

function addSuggestedVolBullet(entryIdx, bulletKey, suggestionIdx) {
  const suggestion = (VOLUNTEER_BULLET_LIBRARY[bulletKey] || [])[suggestionIdx];

  state.volunteer[entryIdx].bullets = state.volunteer[entryIdx].bullets || '';

  state.volunteer[entryIdx].bullets = existing

function renderSkillsAudit() {
  const total = Object.values(state.skills||{}).reduce((s, arr)=>s+(arr||[]).length, 0);
  const gapCats = TOOL_CATEGORIES.filter(c=>c.gap).map(c=>c.key);
  const gapHits = gapCats.filter(k => (state.skills||{})[k] && state.skills[k].length > 0).length;

  let msg = '', cls = '';
  if (total >= 5 && gapHits >= 1) { msg = `Strong: ${total} tools, ${gapHits} from gap categories. You'll outscore most candidates.`; cls = 'good'; }
  else if (total >= 5 && gapHits === 0) { msg = `OK: ${total} tools but zero from gap categories (PM / CRM / Social / Email Mkt). Add ONE for a major advantage.`; cls = 'warn'; }
  else if (total < 5) { msg = `${total} tools listed. The data shows successful candidates have 5+. Add a few from categories above OR commit to learning one from each gap category.`; cls = 'alert'; }
  return `<div class="note ${cls}"><strong>Tool audit:</strong> ${msg}</div>`;
}

/* =========================================================
   AUDIT
   ========================================================= */
function auditResume() {
  const p = state.personal;
  const a = currentArchetype();
  let score = 10;
  const fixes = [];

  // skills count
  const total = Object.values(state.skills||{}).reduce((s, arr)=>s+(arr||[]).length, 0);
  if (total < 5) { score -= 2; fixes.push(`Tools/skills: only ${total} listed. Target 5+. Add tools in the optional skills section.`); }

  // gap categories
  const gapHits = TOOL_CATEGORIES.filter(c=>c.gap).filter(c => (state.skills||{})[c.key] && state.skills[c.key].length > 0).length;
  if (gapHits === 0) { score -= 1; fixes.push('No tools from gap categories (PM / CRM / Social / Email Mkt). Add ONE to stand out.'); }

  // bullets quantified
  const allBullets = (state.experience||[]).flatMap(e => e.bullets||[]);
  if (allBullets.length === 0 && a !== 'fresh') { score -= 2; fixes.push('No experience bullets yet. Create a resume draft or add proof bullets.'); }
  const quantified = allBullets.filter(b => /\d/.test(b)).length;
  const pct = allBullets.length ? quantified/allBullets.length : 0;
  if (allBullets.length && pct < 0.5) { score -= 2; fixes.push(`Only ${Math.round(pct*100)}% of bullets have a number. Target 80%+. Add honest metrics to the proof bullets.`); }

  // cliché scan
  const allText = [state.summary, ...allBullets, state.softSkills].join(' ').toLowerCase();
  const cliches = CLICHE_KILL.filter(c => allText.includes(c.toLowerCase()));
  if (cliches.length) { score -= 1; fixes.push(`Cliché detected: <em>${cliches.join(', ')}</em>. Strip and replace with concrete evidence.`); }

  // archetype-specific
  if (a === 'creative' && !p.portfolio) { score -= 1; fixes.push('Creative archetype but no portfolio link. Mandatory in header.'); }
  if (a === 'creative' && !['pm','crm'].some(k => (state.skills[k]||[]).length)) { score -= 1; fixes.push('Creative: no PM or CRM tool. Add Trello/ClickUp/Notion/HubSpot to close the admin gap — 70% of Creatives in the pool miss this.'); }
  if (a === 'creative' && (state.skills.design||[]).filter(t => /adobe/i.test(t)).length > 3) { score -= 0.5; fixes.push('Creative: lists 4+ Adobe apps. Pick the 2–3 you use weekly. Listing everything signals nothing.'); }

  if (a === 'polished' && !p.onlinejobs && !p.portfolio) { score -= 1; fixes.push('Polished Freelancer should have OnlineJobs.ph or portfolio link in header.'); }
  if (a === 'polished' && !/\d+\s*[-+]?\s*client|portfolio|retention|repeat/i.test([state.summary, ...allBullets].join(' '))) { score -= 1; fixes.push('Polished: no client-count or retention rate surfaced. Mandatory — quantify portfolio size + repeat-client %.'); }

  if (a === 'fresh' && (!state.certifications.length && !state.education.length)) { score -= 1; fixes.push('Fresh Starter: add at least one education entry OR completed/in-progress course.'); }
  if (a === 'fresh' && (state.experience||[]).some(e => (e.bullets||[]).filter(b=>b&&b.trim()).length > 0)) { score -= 1; fixes.push('Fresh Starter: experience bullets detected. Verify this is REAL paid work, not padded internships. If unsure, move to Projects section instead.'); }

  if (a === 'transitioner' && state.summary && !/^seeking to bring/i.test(state.summary.trim())) { score -= 1; fixes.push('Transitioner: summary should open with "Seeking to bring [N] years..." (career-change template). Generic openers signal you didn\'t reframe.'); }
  if (a === 'transitioner' && allBullets.some(b => /\bAHT\b|\bCSR\b|\bIVR\b|\bBPO\b/.test(b))) { score -= 0.5; fixes.push('Transitioner: BPO jargon (AHT/CSR/IVR/BPO) in bullets. Translate to remote-VA equivalents — most VA hiring managers won\'t parse the acronyms.'); }

  if (a === 'solo' && (state.experience||[]).some(e => /owner|operator|founder|proprietor/i.test(e.title||'') && (e.bullets||[]).filter(b=>b&&b.trim()).length < 3)) { score -= 1; fixes.push('Solo Entrepreneur: "Owner" role not decomposed. Split into 3+ functional bullets (Operations, Customer Service, Marketing/Social).'); }
  if (a === 'solo' && !allBullets.some(b => /\$|₱|revenue|customers|SKU|orders|monthly/i.test(b))) { score -= 1; fixes.push('Solo: no revenue/customer/SKU numbers. Add at least one $ or ₱ amount or customer-count metric.'); }

  if (a === 'generalist' && p.headline && /^virtual assistant$/i.test((p.headline||'').trim())) { score -= 1; fixes.push('Generalist: headline is generic "Virtual Assistant". Pick a wedge: Bookkeeping VA / Inbox-Zero VA / Calendar-Coordination VA / Executive Assistant (Remote).'); }
  if (a === 'generalist' && total === (state.skills.productivity||[]).length) { score -= 0.5; fixes.push('Generalist: only productivity tools listed. 93% of the pool has MS Office — it\'s table stakes, not a wedge. Add one specialty tool.'); }
  if (a === 'generalist' && !state.learning) { score -= 0.5; fixes.push('Generalist: no "Currently Learning" line. Signal trajectory — pick one gap-category tool to add.'); }

  // infra
  if (!p.internetSpeed) { score -= 0.5; fixes.push('No internet speed listed. Add it in the basics panel.'); }
  if (!p.timezone) { score -= 0.5; fixes.push('No timezone listed. Add it later before applying.'); }

  score = Math.max(0, Math.round(score*10)/10);
  let cls = 'good', msg = 'Ship-ready.';
  if (score < 7) { cls = 'alert'; msg = 'Major fixes needed. See list below.'; }
  else if (score < 8.5) { cls = 'warn'; msg = 'Apply fixes for a stronger resume.'; }
  return { score, fixes, cls, msg };
}

function renderResumeHTML() {

  const isPolished = a === 'polished';

  const head = `
    <div style="text-align:center;padding-bottom:10px;border-bottom:2px solid #2a2a2a;">
      <div style="font-family:'Playfair Display',Georgia,serif;font-size:22pt;font-weight:700;letter-spacing:-0.01em;line-height:1.15;">${esc(p.name||'Your Name')}</div>

      </div>
      <div style="font-size:${a==='creative'?'13pt':'9.5pt'};color:#555;margin-top:${a==='creative'?'6px':'2px'};">
        ${[ p.linkedin?`<a href="${esc(p.linkedin)}" style="color:#555;">LinkedIn</a>`:'',
            p.onlinejobs?`<a href="${esc(p.onlinejobs)}" style="color:${a==='polished'?'#1a73e8':'#555'};font-weight:${a==='polished'?'600':'normal'};">OnlineJobs.ph</a>`:'',
            p.portfolio?`<a href="${esc(p.portfolio)}" style="color:${a==='creative'?'#1a73e8':'#555'};font-weight:${a==='creative'?'700':'normal'};">Portfolio${a==='creative'?' →':''}</a>`:''
          ].filter(Boolean).join(' · ') }
      </div>
    </div>
  `;

  const summary = state.summary ? `
    <div style="margin-top:14px;">
      <div style="font-family:'Playfair Display',Georgia,serif;font-size:13pt;font-weight:700;color:#3a3a3a;border-bottom:1px solid #888;padding-bottom:2px;margin-bottom:6px;">SUMMARY</div>
      <div style="font-size:10.5pt;">${esc(state.summary)}</div>
    </div>
  ` : '';

  const skills = skillsList.length ? `
    <div style="margin-top:14px;">
      <div style="font-family:'Playfair Display',Georgia,serif;font-size:13pt;font-weight:700;color:#3a3a3a;border-bottom:1px solid #888;padding-bottom:2px;margin-bottom:6px;">SKILLS &amp; TOOLS</div>
      ${ skillsList.map(s => `<div style="font-size:10.5pt;margin-bottom:3px;"><strong>${esc(s.name)}:</strong> ${s.tools.map(esc).join(', ')}</div>`).join('') }
      ${ state.learning ? `<div style="font-size:10.5pt;margin-top:4px;"><strong>Currently learning:</strong> ${esc(state.learning)}</div>` : ''}
      ${ state.softSkills ? `<div style="font-size:10.5pt;margin-top:4px;"><strong>Soft skills:</strong> ${esc(state.softSkills)}</div>` : ''}
      ${ state.languages ? `<div style="font-size:10.5pt;margin-top:4px;"><strong>Languages:</strong> ${esc(state.languages)}</div>` : ''}
    </div>
  ` : '';

  const experience = (state.experience||[]).length ? `
    <div style="margin-top:14px;">
      <div style="font-family:'Playfair Display',Georgia,serif;font-size:13pt;font-weight:700;color:#3a3a3a;border-bottom:1px solid #888;padding-bottom:2px;margin-bottom:6px;">EXPERIENCE</div>
      ${ state.experience.map(e => `
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:10.5pt;">
            <div><strong>${esc(e.title||'Role')}</strong> · ${esc(e.company||'Company')}${e.location?` · ${esc(e.location)}`:''}</div>
            <div style="color:#555;">${esc(fmtDate(e.startDate, e.endDate))}</div>
          </div>
          ${ (e.bullets||[]).filter(b=>b && b.trim()).length ? `
          <ul style="margin:4px 0 0 18px;padding:0;font-size:10.5pt;">
            ${ (e.bullets||[]).filter(b=>b && b.trim()).map(b => `<li style="margin-bottom:2px;">${esc(b)}</li>`).join('') }
          </ul>` : ''}
        </div>
      `).join('') }
    </div>
  ` : '';

  const projects = (state.projects||[]).length ? `
    <div style="margin-top:14px;">
      <div style="font-family:'Playfair Display',Georgia,serif;font-size:13pt;font-weight:700;color:#3a3a3a;border-bottom:1px solid #888;padding-bottom:2px;margin-bottom:6px;">PROJECTS &amp; SELF-TAUGHT SKILLS</div>
      ${ state.projects.map(pr => `
        <div style="margin-bottom:8px;font-size:10.5pt;">
          <strong>${esc(pr.name||'Project')}</strong>${pr.tools?` <span style="color:#777;">(${esc(pr.tools)})</span>`:''}<br>
          ${esc(pr.description||'')}${pr.scale?` <em>· Scale: ${esc(pr.scale)}</em>`:''}
        </div>
      `).join('') }
    </div>
  ` : '';

  const education = (state.education||[]).length ? `
    <div style="margin-top:14px;">

        <div style="display:flex;justify-content:space-between;font-size:10.5pt;margin-bottom:3px;">

      <div style="font-family:'Playfair Display',Georgia,serif;font-size:13pt;font-weight:700;color:#3a3a3a;border-bottom:1px solid #888;padding-bottom:2px;margin-bottom:6px;">CERTIFICATIONS</div>
      ${ state.certifications.map(c => `<div style="font-size:10.5pt;margin-bottom:2px;"><strong>${esc(c.name||'')}</strong>${c.issuer?` · ${esc(c.issuer)}`:''}${c.year?` · ${esc(c.year)}`:''}</div>`).join('') }
    </div>
  ` : '';

  const volunteer = (state.volunteer||[]).length ? `
    <div style="margin-top:14px;">
      <div style="font-family:'Playfair Display',Georgia,serif;font-size:13pt;font-weight:700;color:#3a3a3a;border-bottom:1px solid #888;padding-bottom:2px;margin-bottom:6px;">VOLUNTEER &amp; COMMUNITY</div>
      ${ state.volunteer.map(v => `
        <div style="font-size:10.5pt;margin-bottom:4px;">
          <strong>${esc(v.role||'')}</strong> · ${esc(v.org||'')}${v.period?` <span style="color:#777;">· ${esc(v.period)}</span>`:''}
          ${v.bullets?`<br>${esc(v.bullets)}`:''}
        </div>
      `).join('') }
