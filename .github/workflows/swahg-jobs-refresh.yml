name: Refresh BFF Jobs

on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: swahg-jobs-refresh
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test BFF job board rules
        run: python -m unittest discover -s tests -p 'test_refresh_swahg_jobs.py' -v

      - name: Refresh and verify BFF job board
        run: |
          python scripts/refresh-swahg-jobs.py
          python scripts/refresh-swahg-jobs.py --verify

      - name: Install
        run: npm ci

      - name: Build
        env:
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - name: Commit verified job board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bonafide-filipino-freelancers/jobs
          if git diff --cached --quiet; then
            echo "No BFF jobs changes to commit"
          else
            git commit -m "Refresh BFF jobs"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        uses: actions/deploy-pages@v4

      - name: Verify exact deployed BFF job run
        run: >-
          python scripts/refresh-swahg-jobs.py --verify-live
          https://writingsbylala.com/bonafide-filipino-freelancers/jobs/data
